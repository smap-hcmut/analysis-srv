# Intent Classifier Patterns
# Format: intent_name: [list of regex patterns]
# Patterns are case-insensitive by default

CRISIS:
  - "tẩy\\s*chay"
  - "lừa\\s*đảo"
  - "lừa.*đảo"
  - "scam"
  - "phốt"
  - "bóc\\s*phốt"
  - "bóc.*phốt"
  - "lừa\\s*gạt"
  - "gian\\s*lận"
  - "cảnh\\s*báo"
  - "né\\s*gấp"
  - "bịp"
  - "quỵt"
  # Unsigned variations
  - "tay chay"
  - "lua dao"
  - "boc phot"
  - "ne gap"
  - "quyt"

SEEDING:
  - "\\b0\\d{9,10}\\b"  # Phone numbers
  - "zalo.*\\d{9,10}"
  - "inbox.*giá"
  - "inbox.*mua"
  - "liên\\s*hệ.*mua"
  - "liên\\s*hệ.*\\d{9}"
  - "inbox.*shop"
  - "chat.*shop"
  # Native Ads / Seeding trá hình
  - "trải\\s*nghiệm.*liên\\s*hệ.*\\d{9}"
  - "review.*inbox.*giá"
  - "cảm\\s*ơn.*showroom.*liên\\s*hệ"

SPAM:
  - "vay\\s*tiền"
  - "vay\\s*vốn"
  - "bán\\s*sim"
  - "lãi\\s*suất"
  - "giải\\s*ngân"
  - "tuyển\\s*dụng"
  - "cần\\s*gấp"
  - "thu\\s*nhập"
  - "cộng\\s*tác\\s*viên"
  - "làm\\s*online"
  - "việc\\s*làm\\s*online"
  # Unsigned variations
  - "vay tien"
  - "vay von"
  - "ban sim"
  - "lai suat"
  - "giai ngan"
  - "tuyen dung"
  - "cong tac vien"

COMPLAINT:
  - "lỗi.*(không|chưa).*sửa"
  - "lỗi.*chưa.*khắc\\s*phục"
  - "thất\\s*vọng"
  - "tệ\\s*quá"
  - "tệ.*nhất"
  - "đừng.*mua"
  - "không.*nên.*mua"
  - "rác.*quá"
  - "(tồi|tệ|kém).*chất\\s*lượng"
  - "chất\\s*lượng.*(tệ|kém)"
  - "(quá|rất).*chậm"
  - "hỗ\\s*trợ.*(kém|tệ|chậm)"
  - "thái\\s*độ.*(kém|tệ)"
  - "không.*(bắt\\s*máy|trả\\s*lời|phản\\s*hồi)"
  - "lỗi.*đăng\\s*nhập"
  - "không.*đăng\\s*nhập"
  - "mở.*là.*văng"
  - "văng.*ra"
  - "treo\\s*app"
  - "app.*lỗi"
  # Sarcasm / Mỉa mai
  - "tuyệt\\s*vời.*không.*(bắt\\s*máy|trả\\s*lời)"
  - "tuyệt\\s*vời.*quá.*cơ"
  - "cảm\\s*ơn.*đã.*làm.*hỏng"

LEAD:
  - "giá.*bao\\s*nhiêu"
  - "bao\\s*nhiêu.*tiền"
  - "bao.*tiền"  # Slang: bao tiền
  - "phí.*bao\\s*nhiêu"
  - "bao\\s*nhiêu.*phí"
  - "mua.*ở\\s*đâu"
  - "ở\\s*đâu.*mua"
  - "test\\s*drive"
  - "xin.*giá"
  - "báo\\s*giá"
  - "cho.*xin.*giá"
  - "đặt.*mua"
  - "đặt.*cọc"
  - "mua.*ngay"
  - "có\\s*nên\\s*mua"
  - "nên.*mua.*không"
  - "ưu\\s*đãi.*không"
  - "có.*ưu\\s*đãi"
  # Unsigned variations
  - "gia.*bao.*nhieu"
  - "mua.*o.*dau"

SUPPORT:
  - "cách.*sạc"
  - "làm\\s*sao.*sạc"
  - "làm\\s*sao.*đăng\\s*(ký|nhập)"
  - "showroom"
  - "đại\\s*lý"
  - "bảo\\s*hành"
  - "sửa\\s*chữa"
  - "hướng\\s*dẫn"
  - "cách.*sử\\s*dụng"
  - "trung\\s*tâm.*bảo\\s*hành"
  - "đăng\\s*ký"
  - "tài\\s*khoản"
  - "đăng\\s*nhập"
  - "hoàn\\s*tiền"
  - "liên\\s*hệ.*ở\\s*đâu"
  # Specific support questions
  - "sạc.*ở\\s*đâu"
  - "trạm.*sạc"
