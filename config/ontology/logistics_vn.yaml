# ==============================================================================
# Vietnam On-Demand Logistics — Shared domain ontology
#
# Schema: matches internal.ontology.type.OntologyRegistry.
# Shared by logistics-first brands such as Ahamove and Grab delivery surfaces.
# ==============================================================================

metadata:
  name: smap-logistics-vn
  version: "2026.05.07-logistics-v2"
  description: >
    Vietnam on-demand logistics ontology for social listening across courier,
    food delivery, and last-mile fulfillment conversations.

domain_id: logistics_vn

activation:
  primary_min_score: 2.5
  primary_min_matched_records: 2
  signals:
    - phrase: giao hang
      weight: 2.0
    - phrase: ship hang
      weight: 2.0
    - phrase: tai xe
      weight: 1.5
    - phrase: tai xe cong nghe
      weight: 1.5
    - phrase: don hang
      weight: 1.5
    - phrase: giao do an
      weight: 1.5
    - phrase: grabexpress
      weight: 2.5
    - phrase: grabfood
      weight: 2.0
    - phrase: ahamove
      weight: 2.5
    - phrase: ahatruck
      weight: 2.0
    - phrase: sieu toc
      weight: 1.8
    - phrase: xe van
      weight: 1.5
    - phrase: xe tai
      weight: 1.5
    - phrase: cod
      weight: 1.4
    - phrase: boc xep
      weight: 1.2
    - phrase: phi giao hang
      weight: 1.5

entity_types:
  - brand
  - product
  - person
  - organization
  - location
  - facility
  - retailer
  - concept

