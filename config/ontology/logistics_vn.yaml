    label: Delivery Operations
    topic_family: operations
    main_path_policy: core
    description: Pickup, routing, ETA, handoff, and parcel execution.
    seed_phrases:
      - giao hang
      - lay hang
      - giao cham
      - tre don
      - da giao
      - dang giao
    related_taxonomy_ids:
      - category.last_mile
      - feature.delivery_speed
      - feature.package_safety
    related_aspect_ids: [delivery_speed, package_safety]
    related_issue_ids: [late_delivery, damaged_order, lost_order, safety_concern]
    compatible_entity_types: [brand, product, organization, concept]

  - topic_key: merchant_and_order_quality
    label: Merchant and Order Quality
    topic_family: merchant_ops
    main_path_policy: core
    description: Order correctness, merchant packaging, and item completeness.
    seed_phrases:
      - sai mon
      - thieu mon
      - dong goi
      - giao nham
      - shop chuan bi don
    related_taxonomy_ids:
      - category.merchant_operations
      - feature.order_accuracy
    related_aspect_ids: [order_accuracy, package_safety]
    related_issue_ids: [wrong_item, missing_item, damaged_order]
    compatible_entity_types: [brand, product, retailer, organization, concept]

  - topic_key: pricing_and_promotions
    label: Pricing and Promotions
    topic_family: pricing
    main_path_policy: core
    description: Delivery price, discounts, and voucher effectiveness.
    seed_phrases:
      - phi giao hang
      - ship fee
      - ma giam gia
      - voucher
      - freeship
      - surcharge
    related_taxonomy_ids:
      - feature.delivery_fee
      - feature.promo_value
      - feature.payment
    related_aspect_ids: [delivery_fee, promo_value, payment]
    related_issue_ids: [high_fee, hidden_fee, promotion_failure, payment_problem]
    compatible_entity_types: [brand, product, retailer, organization, concept]

  - topic_key: courier_capacity
    label: Courier Capacity and Quality
