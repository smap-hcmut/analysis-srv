aspect_categories:
  - id: delivery_speed
    label: Delivery Speed
    description: Conversation about shipment speed, ETA, delays, and handoff time.
    seed_phrases:
      - giao nhanh
      - giao cham
      - tre don
      - tre giao
      - eta
      - giao dung gio
      - pickup time
      - dropoff time
      - sieu toc
      - lay hang ngay
      - giao trong 1 gio
      - giao trong 2h
      - giao trong 4h
      - giao trong ngay
    compatible_entity_types: [brand, product, organization, concept]
    linked_topic_keys: [delivery_operations, courier_capacity]
    related_issue_ids: [late_delivery, driver_shortage]

  - id: delivery_fee
    label: Delivery Fee
    description: Conversation about shipping fee, surge fee, and total delivery cost.
    seed_phrases:
      - phi giao hang
      - ship fee
      - cuoc phi
      - phi cao
      - surcharge
      - gia ship
      - phi ung dung
      - dong gia
      - 25k
      - phi diem dung
      - tang gia
    compatible_entity_types: [brand, product, retailer, organization, concept]
    linked_topic_keys: [pricing_and_promotions]
    related_issue_ids: [high_fee, hidden_fee]

  - id: driver_quality
    label: Driver Quality
    description: Conversation about driver attitude, professionalism, and execution quality.
    seed_phrases:
      - tai xe than thien
      - tai xe kho chiu
      - shipper de thuong
      - shipper vo y thuc
      - tai xe huy don
      - phuc vu kem
    compatible_entity_types: [brand, product, person, organization, concept]
    linked_topic_keys: [courier_capacity, support_and_recovery]
    related_issue_ids: [driver_attitude_problem, driver_shortage]

  - id: package_safety
    label: Package Safety
    description: Conversation about intact orders, spills, damage, and delivery care.
    seed_phrases:
      - vo hang
      - be don
      - do an do
      - that lac
      - hu hang
      - nguyen ven
      - hang de vo
      - do de vo
      - bao hiem hang hoa
    compatible_entity_types: [brand, product, retailer, organization, concept]
    linked_topic_keys: [delivery_operations, trust_and_safety]
    related_issue_ids: [damaged_order, lost_order, safety_concern]

  - id: order_accuracy
    label: Order Accuracy
    description: Conversation about missing items, wrong orders, and merchant fulfillment quality.
    seed_phrases:
      - giao sai
      - thieu mon
      - sai mon
      - giao nham
      - thieu hang
      - dung don
    compatible_entity_types: [brand, product, retailer, organization, concept]
    linked_topic_keys: [merchant_and_order_quality]
    related_issue_ids: [wrong_item, missing_item]

  - id: app_experience
    label: App Experience
    description: Conversation about app stability, booking flow, and usability.
    seed_phrases:
      - app loi
      - lag app
      - khong dat duoc don
      - crash app
      - treo app
      - kho dung
      - theo doi lo trinh
      - dat truoc
      - khong dat duoc xe
    compatible_entity_types: [brand, product, organization, concept]
    linked_topic_keys: [app_and_payment]
    related_issue_ids: [app_instability]

  - id: payment
    label: Payment
    description: Conversation about cashless payment, refunds, wallet, and billing.
    seed_phrases:
      - thanh toan
      - vi dien tu
      - momo
      - the tin dung
      - hoan tien
      - thu tien 2 lan
      - cod
      - thu ho
      - ung tien
      - nhan tien mat
      - nap tien
      - rut tien
    compatible_entity_types: [brand, product, retailer, organization, concept]
    linked_topic_keys: [app_and_payment, pricing_and_promotions]
    related_issue_ids: [payment_problem, hidden_fee, promotion_failure]

  - id: support_resolution
    label: Support Resolution
    description: Conversation about support speed, escalation, and problem closure.
    seed_phrases:
      - cham ho tro
      - khong ai xu ly
      - tong dai
      - support
      - chat ho tro
      - giai quyet
      - khieu nai
      - den bu
      - boi thuong
      - bang chung giao hang
    compatible_entity_types: [brand, organization, retailer, concept]
    linked_topic_keys: [support_and_recovery]
    related_issue_ids: [support_problem, lost_order]

  - id: promo_value
    label: Promotion Value
    description: Conversation about discount codes, fee waivers, and voucher effectiveness.
    seed_phrases:
      - ma giam gia
      - voucher
      - freeship
      - khuyen mai
      - khong ap duoc ma
    compatible_entity_types: [brand, product, retailer, organization, concept]
    linked_topic_keys: [pricing_and_promotions]
    related_issue_ids: [promotion_failure, high_fee]

  - id: coverage
    label: Coverage
    description: Conversation about service availability, zone reach, and supply density.
    seed_phrases:
      - khong co tai xe
      - het tai xe
      - khong phuc vu khu nay
      - it shipper
      - pham vi ho tro
      - lien tinh
      - noi thanh
      - ngoai thanh
      - gio cam tai
      - khu vuc phuc vu
    compatible_entity_types: [brand, product, location, organization, concept]
    linked_topic_keys: [courier_capacity]
    related_issue_ids: [driver_shortage, late_delivery]

  - id: trust_safety
    label: Trust and Safety
    description: Conversation about scams, unsafe handling, and platform trust.
    seed_phrases:
      - lua dao
      - scam
      - khong an toan
      - gia mao
      - mat do
      - mat hang
      - tai nan
    compatible_entity_types: [brand, product, person, organization, concept]
    linked_topic_keys: [trust_and_safety, support_and_recovery]
    related_issue_ids: [fraud_concern, safety_concern]

intent_categories:
  - id: question
    label: Question
    description: Asking for information or help.
    seed_phrases: [hoi, "?", bao nhieu, o dau, sao lai]
  - id: complaint
    label: Complaint
    description: Negative operational or service complaint.
    seed_phrases: [te, cham, loi, buc xuc, khong hai long]
  - id: commentary
    label: Commentary
    description: General discussion or observation.
    seed_phrases: [theo minh, thay rang, review, cam nhan]
  - id: praise
    label: Praise
    description: Positive feedback or recommendation.
    seed_phrases: [tot, ok, "on", hai long, rat nhanh]
  - id: purchase_intent
    label: Purchase Intent
    description: Intent to book, order, or try the service.
    seed_phrases: [dat don, goi ship, thu xem, dat mon, book xe]
  - id: compare
    label: Comparison
    description: Comparing services, fees, or delivery quality.
    seed_phrases: [so sanh, compare, vs, hon, kem hon]
  - id: recommendation
    label: Recommendation
    description: Recommending a service or workaround.
    seed_phrases: [nen dung, recommend, gioi thieu, de xuat]

issue_categories:
  - id: late_delivery
    label: Late Delivery
    description: Pickup or delivery is materially slower than expected.
    seed_phrases: [giao cham, tre don, tre giao, qua lau, tre hen]
    compatible_entity_types: [brand, product, organization, concept]
    linked_topic_keys: [delivery_operations, courier_capacity]
    related_aspect_ids: [delivery_speed, coverage]

  - id: high_fee
    label: High Fee
    description: Delivery fee is higher than expected or competitor alternatives.
    seed_phrases: [phi cao, cuoc cao, qua dat, ship mac]
    compatible_entity_types: [brand, product, retailer, organization, concept]
    linked_topic_keys: [pricing_and_promotions, service_comparison]
    related_aspect_ids: [delivery_fee, promo_value]

  - id: hidden_fee
    label: Hidden Fee
    description: Users report unexplained or unexpected charges.
    seed_phrases: [phi an, thu them, tinh sai tien, khong ro phi, phi boc xep, phi diem dung]
    compatible_entity_types: [brand, product, retailer, organization, concept]
    linked_topic_keys: [pricing_and_promotions, app_and_payment]
    related_aspect_ids: [delivery_fee, payment]

  - id: driver_shortage
    label: Driver Shortage
    description: Insufficient available couriers or drivers.
    seed_phrases: [khong co tai xe, het shipper, it tai xe, kho tim tai xe]
    compatible_entity_types: [brand, product, location, organization, concept]
    linked_topic_keys: [courier_capacity, delivery_operations]
    related_aspect_ids: [coverage, delivery_speed, driver_quality]

  - id: driver_attitude_problem
    label: Driver Attitude Problem
    description: Driver behavior, communication, or professionalism issue.
    seed_phrases: [shipper kho chiu, noi chuyen kho nghe, huy don vo ly, thai do kem]
    compatible_entity_types: [brand, product, person, organization, concept]
    linked_topic_keys: [courier_capacity, support_and_recovery]
    related_aspect_ids: [driver_quality, trust_safety]

  - id: damaged_order
    label: Damaged Order
    description: Package, parcel, or food arrives damaged or spilled.
    seed_phrases: [vo hang, do mon, hu hang, nap vo, rot do]
    compatible_entity_types: [brand, product, retailer, organization, concept]
    linked_topic_keys: [delivery_operations, merchant_and_order_quality]
    related_aspect_ids: [package_safety, order_accuracy]

  - id: lost_order
    label: Lost Order
    description: Order or package is missing, untraceable, or never arrives.
    seed_phrases: [that lac, mat don, khong thay hang, bien mat don]
    compatible_entity_types: [brand, product, retailer, organization, concept]
    linked_topic_keys: [delivery_operations, support_and_recovery]
    related_aspect_ids: [package_safety, support_resolution]

  - id: wrong_item
    label: Wrong Item
    description: The received item does not match the placed order.
    seed_phrases: [giao sai mon, giao nham, sai hang, sai san pham]
    compatible_entity_types: [brand, product, retailer, organization, concept]
    linked_topic_keys: [merchant_and_order_quality]
    related_aspect_ids: [order_accuracy, support_resolution]

  - id: missing_item
    label: Missing Item
    description: One or more ordered items are missing.
    seed_phrases: [thieu mon, thieu hang, bo sot, giao thieu]
    compatible_entity_types: [brand, product, retailer, organization, concept]
    linked_topic_keys: [merchant_and_order_quality]
    related_aspect_ids: [order_accuracy, support_resolution]

  - id: payment_problem
    label: Payment Problem
    description: Failed payment, double charge, or refund issue.
    seed_phrases: [thanh toan loi, tru tien 2 lan, khong hoan tien, loi vi, cod loi, thu ho sai, nap tien loi, rut tien loi]
    compatible_entity_types: [brand, product, retailer, organization, concept]
    linked_topic_keys: [app_and_payment, pricing_and_promotions]
    related_aspect_ids: [payment, app_experience]

  - id: app_instability
    label: App Instability
    description: App crashes, hangs, or fails during booking flow.
    seed_phrases: [app lag, app crash, khong load duoc, loi dat don]
    compatible_entity_types: [brand, product, organization, concept]
    linked_topic_keys: [app_and_payment]
    related_aspect_ids: [app_experience, payment]

  - id: support_problem
    label: Support Problem
    description: Support is unreachable, slow, or ineffective.
    seed_phrases: [khong duoc ho tro, cham xu ly, support khong tra loi, tong dai ban, khieu nai lau, den bu cham]
    compatible_entity_types: [brand, organization, retailer, concept]
    linked_topic_keys: [support_and_recovery]
    related_aspect_ids: [support_resolution, trust_safety]

  - id: promotion_failure
    label: Promotion Failure
    description: Promo code, voucher, or freeship does not apply correctly.
    seed_phrases: [khong ap ma, voucher loi, khong freeship, mat uu dai]
    compatible_entity_types: [brand, product, retailer, organization, concept]
    linked_topic_keys: [pricing_and_promotions, app_and_payment]
    related_aspect_ids: [promo_value, payment]

  - id: fraud_concern
    label: Fraud Concern
    description: Scam, impersonation, or suspicious fee collection concern.
    seed_phrases: [lua dao, scam, gia mao, doi ship ao, thu tien la]
    compatible_entity_types: [brand, product, person, organization, concept]
    linked_topic_keys: [trust_and_safety, support_and_recovery]
    related_aspect_ids: [trust_safety, payment]

  - id: safety_concern
    label: Safety Concern
    description: Unsafe driving, unsafe handling, or risk to users and goods.
    seed_phrases: [nguy hiem, khong an toan, lai au, vo y thuc, tai nan]
    compatible_entity_types: [brand, product, person, organization, concept]
    linked_topic_keys: [trust_and_safety, delivery_operations]
    related_aspect_ids: [trust_safety, package_safety]

